# Publishes the cezar image to GHCR so the Dokploy blueprint
# (blueprints/cezar) can run as a one-click image-based template.
#
# No secrets required: GITHUB_TOKEN is enough to push to this repo's package.
# IMPORTANT (one time): after the first successful run, make the package PUBLIC
# (GitHub -> repo -> Packages -> cezar -> Package settings -> Change visibility)
# so your server can pull the image anonymously.
#
# The image is the source of truth: version pins for the agent CLIs live in the
# Dockerfile ARGs, not here.
name: publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/niekes/cezar:latest
            ghcr.io/niekes/cezar:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# Publishes the cezar image to GHCR so the Dokploy blueprint
# (blueprints/cezar) can run as a one-click image-based template.
#
# No secrets required: GITHUB_TOKEN is enough to push to this repo's package.
# IMPORTANT (one time): after the first successful run, make the package PUBLIC
# (GitHub -> repo -> Packages -> cezar -> Package settings -> Change visibility)
# so your server can pull the image anonymously.
#
# The image is the source of truth: version pins for the agent CLIs live in the
# Dockerfile ARGs, not here.
name: publish image

on:
  push:
    branches: [main]
  # New cezar / Claude Code releases land on npm, not here — rebuild daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pass concrete versions instead of "latest": the build-arg is part of the
      # layer cache key, so a new npm release busts the cached install layer.
      - name: Resolve npm versions
        id: v
        run: |
          echo "cezar=$(npm view @open-mercato/cezar version)" >> "$GITHUB_OUTPUT"
          echo "claude=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CEZAR_VERSION=${{ steps.v.outputs.cezar }}
            CLAUDE_CODE_VERSION=${{ steps.v.outputs.claude }}
          tags: |
            ghcr.io/niekes/cezar:latest
            ghcr.io/niekes/cezar:${{ steps.v.outputs.cezar }}
            ghcr.io/niekes/cezar:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max